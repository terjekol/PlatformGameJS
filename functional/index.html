<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plattformspill – funksjonell JavaScript</title>
    <script src="./js/pure.js"></script>
    <link rel="stylesheet" href="../styles.css" />
</head>

<body onload="init()">
    <!-- Game art by: https://bevouliin.com/ -->
    <canvas id="gameCanvas"></canvas>
    <img id="playerImg" src="../img/player.png" />
    <img id="enemyImg" src="../img/enemy.png" />
    <img id="backgroundImg" src="../img/background.png" />

    <script>
        function init() {
            const canvas = document.querySelector('#gameCanvas')
            const ctx = canvas.getContext('2d')
            const meta = initMetadata()

            canvas.width = meta.game.width
            canvas.height = meta.game.height

            const keys = {
                right: false,
                left: false,
                up: false,
            }

            const handleKey = event => {
                if (!event.key.startsWith('Arrow')) return

                const fieldName = event.key.substring(5).toLowerCase()
                keys[fieldName] = event.type === 'keydown'
                event.preventDefault()
            }

            window.addEventListener('keydown', handleKey)
            window.addEventListener('keyup', handleKey)

            const images = ['background', 'player', 'enemy'].reduce(
                (result, name) => ({
                    ...result,
                    [name]: document.querySelector('#' + name + 'Img'),
                }),
                {}
            )

            const gameLoop = state => {
                ctx.clearRect(0, 0, meta.game.width, meta.game.height)

                const params = { state, meta, keys }
                const drawActions = getDrawActions(params)

                for (const action of drawActions) {
                    if (action.text !== undefined) {
                        drawText(ctx, action.text)
                    } else {
                        drawImage(ctx, images[action.image], action)
                    }
                }

                const newState = update(params).state

                if (newState.isRunning) {
                    requestAnimationFrame(() => gameLoop(newState))
                }
            }

            gameLoop(initState(meta))
        }

        function drawText(ctx, text) {
            ctx.font = '50px Arial'
            ctx.shadowColor = 'black'
            ctx.shadowBlur = 7
            ctx.lineWidth = 5
            ctx.fillStyle = 'white'
            ctx.strokeText(text, 550, 100)
            ctx.shadowBlur = 0
            ctx.fillText(text, 550, 100)
        }

        function drawImage(ctx, image, action) {
            if (action.frameX === undefined) {
                ctx.drawImage(image, action.x, action.y)
                return
            }

            ctx.drawImage(
                image,
                action.frameX,
                action.frameY,
                action.width,
                action.height,
                action.x,
                action.y,
                action.width,
                action.height
            )
        }

        function initMetadata() {
            return {
                game: {
                    width: 800,
                    height: 720,
                    downforce: 1,
                },
                player: {
                    y: 720 - 200,
                    width: 200,
                    height: 200,
                    spriteCounts: [7, 9],
                },
                enemy: {
                    y: 720 - 60,
                    width: 80,
                    height: 60,
                    spriteCounts: [6],
                },
                background: {
                    width: 2400,
                },
            }
        }

        function initState(meta) {
            return {
                score: 0,
                isRunning: true,
                background: createState(0, 0, -2, 0),
                player: createState(0, meta.player.y, 0, 0, 0, 0, 0),
                enemy: createState(meta.game.width, meta.enemy.y, -1, 0, 0, 0, 0),
            }
        }

        function createState(x, y, speedX, speedY, spriteIndex, spriteSkipIndex, mode) {
            if (spriteIndex === undefined) {
                return { x, y, speedX, speedY }
            }

            return {
                x,
                y,
                speedX,
                speedY,
                spriteIndex,
                spriteSkipIndex,
                mode,
            }
        }
    </script>
</body>

</html>
